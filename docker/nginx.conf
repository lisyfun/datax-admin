# 工作进程数
worker_processes auto;

# 事件模块配置
events {
    worker_connections 1024;
}

# HTTP模块配置
http {
    # MIME类型配置
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 在 http 块中添加
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 基础设置
    sendfile        on;
    keepalive_timeout  10;


    # 安全设置
    server_tokens off;  # 隐藏 Nginx 版本信息
    add_header X-Frame-Options "DENY" always;  # 防止点击劫持
    add_header X-XSS-Protection "1; mode=block" always;  # XSS 保护（兼容性头）
    add_header X-Content-Type-Options "nosniff" always;  # 防止 MIME 类型嗅探
    add_header Referrer-Policy "no-referrer" always;  # 控制 Referer 头
    # 注意：CSP 仅在静态页面位置设置，避免影响 API 响应

    # 限制请求频率
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;



    # Gzip压缩
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 服务器配置
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost;

        # 配置日志
        access_log /var/log/nginx/access.log;

        # 限制连接数
        limit_conn addr 10;

        # 限制请求频率
        limit_req zone=one burst=20 nodelay;

        # 重定向根路径到 /datax/
        location = / {
            return 301 /datax/;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 禁止访问特定文件类型
        location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|old|proj|git|svn|zip|tar|gz|rar)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 禁止访问特定路径
        location ~* ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 处理静态文件
        location /datax/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
            index index.html;
            # 静态页面安全响应头（替代全局 CSP）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:28080; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }


        # API 反向代理
        location /datax/api/ {
            proxy_pass http://localhost:28080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 500m;
            proxy_connect_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            # CORS 交由后端处理（已按白名单收紧），此处不再覆盖响应头
        }

        # 上传接口特殊配置
        location ~ ^/datax/api/v1/terminals/([^/]+)/upload {
            proxy_pass http://localhost:28080/api/v1/terminals/$1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 上传接口超时设置
            client_body_timeout 1800s;        # 30分钟
            proxy_connect_timeout 1800s;      # 30分钟
            proxy_send_timeout 1800s;         # 30分钟
            proxy_read_timeout 1800s;         # 30分钟

            # 上传文件大小限制
            client_max_body_size 1000m;       # 上传文件大小限制为1000MB
        }

        # WebSocket 反向代理
        location /datax/ws/ {
            proxy_pass http://localhost:28080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket 连接的超时设置
            proxy_read_timeout 600s;    # 增加到10分钟
            proxy_send_timeout 600s;    # 增加到10分钟
            proxy_connect_timeout 600s;  # 增加到10分钟

            # 禁用 keepalive_timeout
            keepalive_timeout 0;
        }
    }
}
