server:
  port: ":28080"
  mode: release
  base_path: "/"
  max_file_size: 500  # 500MB
  # 可信反向代理 IP/CIDR。留空表示不信任任何代理的 X-Forwarded-For。
  # 经 nginx 等反向代理部署时，必须填入代理地址，否则所有请求都会被识别为代理 IP。
  trusted_proxies:
    - "127.0.0.1"
    - "::1"

db:
  type: mysql  # 数据库类型: mysql, postgres
  host: host.docker.internal
  port: 13306
  username: root
  # 请通过环境变量 DB_PASSWORD 注入
  password: ""
  dbname: datax_admin
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  log_mode: warn
  charset: utf8mb4
  time_zone: Asia/Shanghai
  ssl_mode: disable  # PostgreSQL SSL模式: disable, require, verify-ca, verify-full

datax:
  home: "/app"  # DataX 安装目录
  bin: "/app/bin/datax"  # DataX 可执行文件路径

logger:
  log_path: "logs"  # 日志文件路径
  max_size: 100     # 单个日志文件最大大小（MB）
  max_backups: 7    # 最大保留的旧日志文件数
  max_age: 30       # 日志文件保留的最大天数
  compress: true    # 是否压缩旧日志文件

# 认证配置
auth:
  # 请通过环境变量 AUTH_SECRET 注入（>=32 字节随机字符串）
  secret: ""
  expiration: 86400                # Session过期时间(秒)，86400=1天
  allow_register: false            # 是否允许公开注册
  cookie_secure: false             # 启用 HTTPS 后建议设为 true

# 任务日志配置
job_log:
  max_age: 30        # 日志保留天数，默认30天
  auto_cleanup: true # 是否启用自动清理

# 初始化配置
init:
  force_reset: false       # 是否强制重新初始化数据（会清空现有数据）
  default_password: ""     # 为空时首次启动生成随机密码并打印到日志

# 敏感数据加密（SSH/Kafka/Redis 凭据）
security:
  encryption_key: ""       # 建议通过 SECURITY_ENCRYPTION_KEY 注入；为空时自动生成 data/encryption.key

# SSH 安全配置
ssh:
  known_hosts_path: ""             # 为空使用 ~/.ssh/known_hosts
  insecure_ignore_host_key: false  # 危险：仅测试环境可设为 true

# Kafka 客户端 TLS 配置
kafka:
  insecure_skip_verify: false  # 危险：跳过 broker 证书校验，仅测试环境可设为 true
  ca_file: ""                  # 自签 CA 证书路径（PEM）
