server:
  port: ":28080"
  mode: release
  base_path: "/"
  max_file_size: 500  # 500MB

db:
  type: mysql  # 数据库类型: mysql, postgres
  host: host.docker.internal
  port: 13306
  username: root
  password: 123456
  dbname: datax_admin
  max_idle_conns: 25
  max_open_conns: 200
  conn_max_lifetime: 1800
  log_mode: warn
  charset: utf8mb4
  time_zone: Asia/Shanghai
  ssl_mode: disable  # PostgreSQL SSL模式: disable, require, verify-ca, verify-full

datax:
  home: "/app"  # DataX 安装目录
  bin: "/app/bin/datax"  # DataX 可执行文件路径

logger:
  log_path: "logs"  # 日志文件路径
  max_size: 100     # 单个日志文件最大大小（MB）
  max_backups: 7    # 最大保留的旧日志文件数
  max_age: 30       # 日志文件保留的最大天数
  compress: true    # 是否压缩旧日志文件

# 认证配置
auth:
  secret: "a266d59b88e44d618aaab77bac0f7a50"    # Session密钥
  expiration: 86400                # Session过期时间(秒)，86400=1天

# 任务日志配置
job_log:
  max_age: 30        # 日志保留天数，默认30天
  auto_cleanup: true # 是否启用自动清理

# 初始化配置
init:
  force_reset: false # 是否强制重新初始化数据（会清空现有数据）